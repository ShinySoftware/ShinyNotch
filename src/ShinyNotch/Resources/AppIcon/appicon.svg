<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- squircle body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262163"/>
      <stop offset="0.55" stop-color="#141236"/>
      <stop offset="1" stop-color="#0A0B1E"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <!-- accents -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="artShine" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="barGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- drop shadow -->
  <rect x="128" y="150" width="768" height="790" rx="180" fill="#000" opacity="0.45" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- aurora light low in the frame -->
    <ellipse cx="250" cy="860" rx="300" ry="170" fill="#7C3AED" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="800" cy="900" rx="300" ry="170" fill="#06B6D4" opacity="0.45" filter="url(#soft)"/>
    <ellipse cx="520" cy="980" rx="260" ry="120" fill="#EC4899" opacity="0.30" filter="url(#soft)"/>

    <!-- the menu bar the notch sits in -->
    <rect x="100" y="100" width="824" height="62" fill="#FFFFFF" opacity="0.07"/>
    <rect x="100" y="161" width="824" height="1.5" fill="#FFFFFF" opacity="0.10"/>
    <rect x="214" y="123" width="22" height="16" rx="5" fill="#FFFFFF" opacity="0.45"/>
    <rect x="788" y="123" width="22" height="16" rx="5" fill="#FFFFFF" opacity="0.45"/>

    <!-- glow behind the notch -->
    <path d="M 252 100 H 772 V 432 Q 772 512 692 512 H 332 Q 252 512 252 432 Z" fill="url(#accent)" opacity="0.85" filter="url(#glow)"/>

    <!-- the notch, grown into a panel -->
    <path d="M 252 100 H 772 V 432 Q 772 512 692 512 H 332 Q 252 512 252 432 Z" fill="#000"/>
    <path d="M 252 100 H 772 V 432 Q 772 512 692 512 H 332 Q 252 512 252 432 Z" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>

    <!-- camera dot, where the real notch's camera sits -->
    <circle cx="512" cy="138" r="13" fill="#15152A"/>
    <circle cx="512" cy="138" r="5" fill="#2E3A8C"/>

    <!-- album art -->
    <rect x="300" y="196" width="150" height="150" rx="34" fill="url(#art)"/>
    <rect x="300" y="196" width="150" height="150" rx="34" fill="url(#artShine)"/>
    <circle cx="375" cy="271" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="7"/>
    <circle cx="375" cy="271" r="9" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- equaliser -->
    <g filter="url(#barGlow)" opacity="0.7">
      <rect x="494" y="246" width="30" height="100" rx="15" fill="url(#bars)"/>
      <rect x="544" y="196" width="30" height="150" rx="15" fill="url(#bars)"/>
      <rect x="594" y="226" width="30" height="120" rx="15" fill="url(#bars)"/>
      <rect x="644" y="266" width="30" height="80" rx="15" fill="url(#bars)"/>
      <rect x="694" y="216" width="30" height="130" rx="15" fill="url(#bars)"/>
    </g>
    <rect x="494" y="246" width="30" height="100" rx="15" fill="url(#bars)"/>
    <rect x="544" y="196" width="30" height="150" rx="15" fill="url(#bars)"/>
    <rect x="594" y="226" width="30" height="120" rx="15" fill="url(#bars)"/>
    <rect x="644" y="266" width="30" height="80" rx="15" fill="url(#bars)"/>
    <rect x="694" y="216" width="30" height="130" rx="15" fill="url(#bars)"/>

    <!-- progress -->
    <rect x="300" y="406" width="424" height="14" rx="7" fill="#27272A"/>
    <rect x="300" y="406" width="262" height="14" rx="7" fill="url(#accent)"/>
    <circle cx="562" cy="413" r="20" fill="#FFFFFF"/>

    <!-- glass rim -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
